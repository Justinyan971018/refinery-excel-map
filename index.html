<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球炼厂交互地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyo0MTF0Yekgfhw=" crossorigin="">
<style>
*{box-sizing:border-box}html,body{padding:0;margin:0;height:100%;font-family:'Microsoft YaHei',Arial,sans-serif;background:#f8fafb;color:#203441}#bar{height:43px;display:flex;align-items:center;gap:10px;padding:5px 12px;background:#fff;border-bottom:1px solid #d8e2e7}h1{font-size:14px;margin:0;white-space:nowrap}.small{font-size:11px;color:#617985}.right{margin-left:auto}button{padding:6px 10px;border:1px solid #bed4dd;background:#edf7fa;color:#1a5062;border-radius:5px;cursor:pointer;font-size:12px}button:hover{background:#dbedf3}#map{height:calc(100% - 70px);width:100%}#foot{height:27px;padding:5px 12px;display:flex;justify-content:space-between;font-size:11px;color:#617985;background:#fff;border-top:1px solid #dde7eb}.leaflet-tooltip{border:1px solid #bed4df;border-radius:7px;box-shadow:0 4px 16px #0002;font:12px 'Microsoft YaHei',Arial,sans-serif}.popup-title{font-weight:bold;font-size:13px;margin-bottom:6px}.p-row{margin:3px 0}.leg{position:absolute;z-index:1000;right:12px;top:55px;background:#fff;padding:9px 12px;box-shadow:0 1px 8px #0002;border-radius:5px;font-size:12px;pointer-events:none}.leg>div{margin-top:6px}.dot{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle}.leaflet-container{background:#cdd4d3}
</style></head><body><div id="bar"><h1>GLOBAL REFINERY MAP</h1><span class="small" id="status">正在初始化…</span><button class="right" id="refresh">从Excel刷新数据</button><button id="world">全球视角</button></div><div id="map"></div><div class="leg"><strong>Process Unit Name</strong><div><i class="dot" style="background:#99DDED"></i>Atmos Distillation</div><div><i class="dot" style="background:#24586D"></i>Condensate Splitter</div></div><div id="foot"><span id="counts">—</span><span>数据仅从本工作簿读取 · OpenStreetMap</span></div>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const statusEl=document.getElementById('status'),countEl=document.getElementById('counts');
const map=L.map('map',{preferCanvas:true,zoomSnap:.5,worldCopyJump:true}).setView([17,12],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18,minZoom:2}).addTo(map);
const layer=L.layerGroup().addTo(map);
const palette={'Atmos Distillation':'#99DDED','Condensate Splitter':'#24586D'};
function safe(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function numeric(x){if(typeof x==='number')return x;return Number(String(x??'').replace(/,/g,''));}
async function reload(){statusEl.textContent='正在读取 map data 工作表…';try{
 if(typeof Excel==='undefined'||typeof Office==='undefined'){throw new Error('请在Excel加载项中打开（不能直接在普通浏览器中读取Excel）。');}
 const data=await Excel.run(async ctx=>{const s=ctx.workbook.worksheets.getItem('map data');const r=s.getUsedRange();r.load('values');await ctx.sync();return r.values;});
 if(!data?.length)throw new Error('map data 工作表为空。');
 const headers=data[0].map(x=>String(x).trim().toLowerCase());
 const index=(key)=>headers.indexOf(key.toLowerCase());
 const latI=index('Latitude'),lonI=index('Longitude'),typI=index('Process Unit Name'),capI=index('Capacity (SUM)'),refI=index('Refinery Name'),countryI=index('Country');
 if([latI,lonI,typI,capI].some(x=>x<0))throw new Error('列标题必须包含 Latitude、Longitude、Process Unit Name、Capacity (SUM)');
 layer.clearLayers();let valid=0;let maxCap=0;const rows=[];
 for(const row of data.slice(1)){const lat=numeric(row[latI]),lon=numeric(row[lonI]),cap=numeric(row[capI]);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;rows.push({lat,lon,cap:Number.isFinite(cap)&&cap>0?cap:0,type:String(row[typI]??''),ref:refI>=0?row[refI]:null,country:countryI>=0?row[countryI]:null});maxCap=Math.max(maxCap,Number.isFinite(cap)?cap:0);}
 for(const d of rows){const color=palette[d.type]||'#5083a1';const radius=3.5+Math.sqrt(d.cap/Math.max(1,maxCap))*12;const m=L.circleMarker([d.lat,d.lon],{radius,fillColor:color,color:color,fillOpacity:.66,opacity:.85,weight:.8});const title=d.ref?`<div class="popup-title">${safe(d.ref)}</div>`:'';
 const html=`${title}<div class="p-row"><b>Process Unit Name</b>：${safe(d.type)}</div>${d.country?`<div class="p-row"><b>Country</b>：${safe(d.country)}</div>`:''}<div class="p-row"><b>Capacity (SUM)</b>：${safe(d.cap)}</div><div class="p-row"><b>Lat / Lon</b>：${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}</div>`;
 m.bindTooltip(html,{direction:'top',opacity:.97,sticky:true});m.bindPopup(html);m.addTo(layer);valid++;}
 statusEl.textContent=`已读取 ${valid} 条炼厂装置记录`;
 countEl.textContent=`图层 ${valid} 条 · ${Object.keys(palette).join(' / ')}`;
 }catch(err){statusEl.textContent='读取失败：'+err.message;console.error(err);}}
document.getElementById('refresh').addEventListener('click',reload);
document.getElementById('world').addEventListener('click',()=>map.setView([17,12],2));
if(typeof Office!=='undefined'){Office.onReady(info=>{if(info.host===Office.HostType.Excel)reload();else statusEl.textContent='请从Excel工作簿内打开。';});}
else statusEl.textContent='演示预览：请在Excel中启动加载项获取数据。';
setTimeout(()=>map.invalidateSize(),600);
</script></body></html>
